# Copy to config/repos.yaml and replace the placeholder paths with your real ones.
# config/repos.yaml is gitignored. Company repositories are READ-ONLY data sources:
# `read_only: true` is mandatory and `false` is rejected.
repositories:
  - name: he-play
    path: /path/to/he-play
    enabled: false
    read_only: true

  - name: he-qa
    path: /path/to/he-qa
    enabled: false
    read_only: true

  - name: he-playrate
    path: /path/to/he-playrate
    enabled: false
    read_only: true

  - name: mcs
    path: /path/to/mcs
    enabled: false
    read_only: true
